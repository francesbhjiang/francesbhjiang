name: Update 3D contribution graph
on:
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-contribution-graph
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@0.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit generated landscape
        run: |
          set -euo pipefail
          test -s profile-3d-contrib/profile-season-animate.svg
          if grep -q "The contribution landscape will appear" profile-3d-contrib/profile-season-animate.svg; then
            echo "Contribution graph was not generated" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-3d-contrib/profile-season-animate.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update 3D contribution graph'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
